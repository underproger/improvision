<!-- ============================== LEAD FORM MODAL ============================== -->
<dialog class="modal" aria-labelledby="modal-title" data-modal>
  <div class="modal__box">
    <button class="modal__close" type="button" aria-label="Закрити" data-modal-close>{{icon:close}}</button>
    <h2 class="modal__title" id="modal-title">Залишити заявку</h2>
    <p class="modal__text">Залиште контакти — ми звʼяжемося протягом робочого дня, уточнимо задачу та підготуємо орієнтовний розрахунок.</p>
    <form class="form form--boxed" action="#" method="post" novalidate data-form>
      <label class="field">
        <span class="visually-hidden">Ваше ім’я</span>
        <input class="field__control" type="text" name="name" placeholder="Ваше ім’я" autocomplete="name" required>
      </label>
      <div class="form__row">
        <label class="field">
          <span class="visually-hidden">Телефон</span>
          <input class="field__control" type="tel" name="phone" placeholder="+38 (0__) ___-__-__" autocomplete="tel" inputmode="tel" required data-phone-mask>
        </label>
        <label class="field">
          <span class="visually-hidden">Email</span>
          <input class="field__control" type="email" name="email" placeholder="Email" autocomplete="email">
        </label>
      </div>
      <label class="field field--select">
        <span class="visually-hidden">Послуга / тип проєкту</span>
        <select class="field__control is-placeholder" name="service" data-select data-modal-service>
          <option value="" selected>Послуга / тип проєкту</option>
          <option data-visit-option>Виїзд спеціаліста на обʼєкт</option>
          <option>Комерційне будівництво «під&nbsp;ключ»</option>
          <option>Вентильовані фасади</option>
          <option>Вхідні групи</option>
          <option>Зовнішня реклама</option>
          <option>Інтерʼєрна реклама та навігація</option>
          <option>Дизайн і проєктування</option>
          <option>Оздоблювальні та реконструкційні роботи</option>
          <option>Інше</option>
        </select>
      </label>
      <label class="field">
        <span class="visually-hidden">Ваше повідомлення</span>
        <textarea class="field__control" name="message" rows="3" placeholder="Ваше повідомлення"></textarea>
      </label>
      <button class="btn btn--primary form__submit" type="submit">Надіслати заявку{{icon:arrow}}</button>
      <p class="form__consent form__consent--center">Натискаючи кнопку, ви погоджуєтесь з обробкою <a href="privacy.html">персональних даних</a></p>
      <p class="form__status" role="status" aria-live="polite" hidden data-form-status></p>
    </form>
  </div>
</dialog>

<button class="to-top" type="button" aria-label="Нагору" data-to-top>{{icon:arrow-up}}</button>
